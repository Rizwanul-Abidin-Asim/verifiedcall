services:
  postgres:
    image: postgres:16-alpine
    container_name: verifiedcall-postgres
    environment:
      POSTGRES_USER: verifiedcall
      POSTGRES_PASSWORD: verifiedcall
      POSTGRES_DB: verifiedcall
    ports:
      # 55432, not 5432: this machine already runs another Postgres on the default port,
      # and colliding meant the app silently connected to the wrong database.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifiedcall"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verifiedcall-redis
    ports:
      - "56379:6379"  # avoids any pre-existing local Redis, same reasoning as Postgres
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
